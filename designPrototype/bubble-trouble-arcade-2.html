
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Trouble - Cyberpunk Arcade</title>
  
  <!-- Estilização Base e Variáveis Modernas -->
  <style>
    :root {
      --color-bg: #050508;
      --color-cabinet: #111118;
      --color-screen-bg: #09090f;
      --color-border: #1a1a2b;
      --color-fg: #f0f0f5;
      --color-muted: #6e6e80;
      
      /* Neon Cyberpunk Palette (Substitutos de OKLch) */
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff0055;
      --neon-gold: #ffb700;
      --neon-green: #00ff66;
      
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--color-bg);
      background-image: 
        radial-gradient(circle at 50% 50%, #151525 0%, #050508 100%),
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
      background-size: 100% 100%, 100% 4px, 6px 100%;
      color: var(--color-fg);
      font-family: var(--font-sans);
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Gabinete de Arcade Retro */
    .arcade-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 20px;
    }

    .arcade-cabinet {
      background-color: var(--color-cabinet);
      border-left: 16px solid #222232;
      border-right: 16px solid #222232;
      border-top: 10px solid #2d2d42;
      border-bottom: 20px solid #0a0a0f;
      box-shadow: 
        0 0 40px rgba(0, 0, 0, 0.95),
        0 0 20px rgba(0, 240, 255, 0.1),
        0 0 60px rgba(255, 0, 85, 0.08);
      display: flex;
      flex-direction: column;
      width: 960px;
      max-width: 100%;
      height: 740px;
      max-height: 100%;
      border-radius: 8px;
      position: relative;
    }

    .cabinet-header {
      height: 60px;
      background: linear-gradient(180deg, #09090f 0%, #151522 100%);
      border-bottom: 3px solid var(--neon-magenta);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.25);
    }

    .marquee-text-side {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--neon-gold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: pulse 1.5s infinite alternate;
    }

    .marquee-title {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7), 0 0 20px rgba(0, 240, 255, 0.3);
      letter-spacing: 0.2em;
      text-align: center;
    }

    .cabinet-screen-area {
      flex-grow: 1;
      background-color: #030307;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .crt-container {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: var(--color-screen-bg);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.95);
      border: 6px solid #1a1a24;
    }

    /* overlays visuais de CRT - pointer-events none garante cliques passando direto */
    .crt-scanlines {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.2) 50%
      );
      background-size: 100% 4px;
      z-index: 8;
      pointer-events: none;
    }

    .crt-glow {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(
        circle at 50% 50%, 
        rgba(255, 255, 255, 0.02) 0%, 
        rgba(0, 0, 0, 0.3) 100%
      );
      z-index: 9;
      pointer-events: none;
    }

    .crt-flicker {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 16, 16, 0.012);
      opacity: 0.1;
      z-index: 10;
      pointer-events: none;
      animation: crt-flicker-anim 0.25s infinite;
    }

    @keyframes crt-flicker-anim {
      0% { opacity: 0.10; }
      50% { opacity: 0.12; }
      100% { opacity: 0.10; }
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* Painel de Controle Físico do Cabinet */
    .cabinet-panel {
      height: 110px;
      background: linear-gradient(180deg, #151522 0%, #08080f 100%);
      border-top: 3px solid var(--neon-cyan);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 15px;
      box-shadow: inset 0 8px 16px rgba(0,0,0,0.8);
      position: relative;
    }

    .control-deck {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .control-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-muted);
      text-align: center;
      margin-top: 5px;
      letter-spacing: 0.1em;
    }

    /* Joysticks Virtuais */
    .joystick-base {
      width: 50px;
      height: 50px;
      background: #09090f;
      border: 3px solid #2d2d42;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
    }

    .joystick-knob {
      width: 24px;
      height: 24px;
      background: radial-gradient(circle at 35% 35%, #ff3b30 0%, #8b0000 100%);
      border-radius: 50%;
      position: absolute;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      transition: transform 0.1s ease;
    }

    .joystick-knob.tilt-left { transform: translate(-10px, 0); }
    .joystick-knob.tilt-right { transform: translate(10px, 0); }

    /* Botões Arcade de Ação */
    .arcade-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      box-shadow: 
        0 4px 0px #000,
        0 6px 10px rgba(0,0,0,0.6);
      position: relative;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }

    .arcade-button:active, .arcade-button.pressed {
      transform: translateY(3px);
      box-shadow: 
        0 1px 0px #000,
        0 2px 5px rgba(0,0,0,0.4);
    }

    .arcade-button.cyan {
      background: radial-gradient(circle at 35% 35%, var(--neon-cyan) 0%, #007a87 100%);
      border: 2px solid #00f0ff;
    }

    .arcade-button.magenta {
      background: radial-gradient(circle at 35% 35%, var(--neon-magenta) 0%, #8f002b 100%);
      border: 2px solid #ff0055;
    }

    .coin-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08080f;
      border: 2px solid #222230;
      padding: 5px 12px;
      border-radius: 4px;
    }

    .coin-slot {
      width: 14px;
      height: 24px;
      background: #ff5e00;
      box-shadow: 0 0 8px #ff5e00;
      border-radius: 2px;
      margin-bottom: 4px;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .coin-text {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--neon-gold);
      font-weight: bold;
    }

    /* Conteúdo Principal React */
    #root {
      position: relative;
      z-index: 15; /* Z-INDEX SUPERIOR PARA CLIQUE GARANTIDO */
      width: 100%;
      height: 100%;
    }

    /* Warning de Erro / Loader Inicial */
    #no-js-warning {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--color-screen-bg);
      color: var(--neon-magenta);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      padding: 30px;
      z-index: 999;
      text-align: center;
    }

    .system-loader-spinner {
      border: 4px solid rgba(0, 240, 255, 0.1);
      border-left-color: var(--neon-cyan);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Estilos Gerais de Telas do Jogo */
    .game-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 25px;
      box-sizing: border-box;
      position: relative;
      background-color: var(--color-screen-bg);
    }
  </style>

  <!-- Tratamento de Erros e Logs Críticos na Tela para Depuração Directa -->
  <script>
    window.addEventListener('error', function(e) {
      const errorDiv = document.getElementById('loader-error-logs');
      const warningScreen = document.getElementById('no-js-warning');
      if (errorDiv && warningScreen) {
        warningScreen.style.color = '#ff0055';
        errorDiv.innerHTML = `
          <div style="font-weight:bold; font-size:16px; margin-bottom:10px;">BOOT FAILURE DETECTED:</div>
          <div style="text-align:left; background:#181825; padding:12px; border:1px solid #ff0055; font-size:11px; white-space:pre-wrap; max-height:200px; overflow-y:auto; color:#f0f0f5; margin-top:10px;">
            Error: ${e.message}\nSource: ${e.filename}\nLine: ${e.lineno}:${e.colno}
          </div>
          <button onclick="window.location.reload()" style="margin-top:20px; background:#ff0055; color:#fff; border:none; padding:10px 20px; font-family:monospace; cursor:pointer; font-weight:bold; box-shadow:0 0 10px #ff0055;">FORCE REBOOT</button>
        `;
        const spinner = warningScreen.querySelector('.system-loader-spinner');
        if (spinner) spinner.style.display = 'none';
      }
    });
  </script>
